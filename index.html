<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödev Arkadaşı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EA;--ink:#2B2A4C;--muted:#6E6C8C;--card:#fff;--orange:#FF8A3D;--blue:#3D9BFF;--green:#20B072;--purple:#8E6CEF;--pink:#FF5C8A;--yellow:#FFC93C;--line:#F0E3CC}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 28px;background:#fff;border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;cursor:pointer;background:none;border:0;padding:0}
.goal{flex:1;max-width:360px;margin-left:auto}
.goal small{display:block;font-weight:800;color:var(--muted);margin-bottom:4px;font-size:14px}
.bar{height:14px;background:#F3EAD8;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:99px;transition:width .5s}
.pill{background:#FFF1C9;border-radius:99px;padding:8px 16px;font-weight:900;font-size:18px;white-space:nowrap}
.iconbtn{border:0;background:#F1ECFF;border-radius:14px;width:46px;height:46px;font-size:21px;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:#E6DEFF}
.iconbtn.sm{width:38px;height:38px;font-size:17px;border-radius:12px;vertical-align:middle;margin-left:8px}
main{max-width:1100px;margin:0 auto;padding:28px}
main.wide{max-width:1600px;padding:16px 24px}
h1{font-size:34px;margin:4px 0 6px;font-weight:900}
.lead{color:var(--muted);font-weight:700;font-size:19px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border-radius:28px;padding:24px;border:3px solid transparent;box-shadow:0 6px 0 rgba(43,42,76,.07);cursor:pointer;transition:transform .15s,border-color .15s;display:flex;gap:18px;align-items:center;text-align:left;width:100%}
.card:hover{transform:translateY(-3px);border-color:var(--line)}
.card:disabled{opacity:.6;cursor:default;transform:none}
.card .emo{font-size:48px;width:86px;height:86px;border-radius:24px;display:grid;place-items:center;flex:none}
.card h3{margin:0 0 4px;font-size:25px;font-weight:900}
.card p{margin:0;color:var(--muted);font-weight:700;font-size:16px}
.wide{grid-column:1/-1}
.c-orange .emo{background:#FFE8D8}.c-blue .emo{background:#DDEEFF}.c-green .emo{background:#D8F5E8}.c-purple .emo{background:#ECE5FF}.c-pink .emo{background:#FFE1EA}.c-yellow .emo{background:#FFF1C9}
.hero{background:linear-gradient(120deg,#8E6CEF,#B08CFF);color:#fff}
.hero p{color:#F1EBFF}.hero .emo{background:rgba(255,255,255,.2)}
.hero:hover{border-color:#fff}
.btn{border:0;border-radius:18px;padding:14px 22px;font-weight:900;font-size:18px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 #E06A1F}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #148A57}
.btn.soft{background:#F1ECFF;color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:16px;border-radius:14px}
.btn.danger{background:#FFE1EA;color:#B3123F}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.center{text-align:center;justify-content:center}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px}
/* round */
.rtop{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.rtitle{font-weight:900;font-size:24px;flex:1}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:#EADFC9;display:block}
.dots i.now{background:var(--orange);transform:scale(1.2)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--pink)}
.qcard{background:#fff;border-radius:32px;padding:34px;box-shadow:0 6px 0 rgba(43,42,76,.07);text-align:center}
.qemo{font-size:72px;line-height:1;margin-bottom:10px}
.qtext{font-size:30px;font-weight:900;margin-bottom:8px}
.qtext.big{font-size:56px;letter-spacing:1px}
.qsub{font-size:20px;color:var(--muted);font-weight:700;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{background:#FFF7EA;border:3px solid var(--line);border-radius:22px;padding:20px 14px;font-size:26px;font-weight:900;cursor:pointer;transition:transform .1s,background .2s}
.opt:hover:not(:disabled){background:#FFEFD6;transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.ok{background:#D8F5E8;border-color:var(--green);color:#0E7A4C}
.opt.no{background:#FFE1EA;border-color:var(--pink);color:#B3123F}
.opt .k{display:inline-block;font-size:14px;color:var(--muted);background:#fff;border-radius:8px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.sylls{display:flex;justify-content:center;flex-wrap:wrap}
.syl{min-width:120px;font-size:32px}
.syl.used{opacity:.25}
.slots{display:flex;gap:10px;justify-content:center;margin:20px 0 4px;flex-wrap:wrap}
.slot{min-width:110px;height:72px;border:3px dashed #E2D3B6;border-radius:20px;display:grid;place-items:center;font-size:32px;font-weight:900}
.slot.filled{border-style:solid;border-color:var(--green);background:#EFFAF4}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.explain{margin-top:24px;background:#F5F0FF;border-radius:24px;padding:20px 24px;text-align:left;font-size:20px;font-weight:700;line-height:1.5;animation:pop .25s}
.exh{font-weight:900;color:var(--purple);margin-bottom:6px}
.praise{margin-top:22px;font-size:30px;font-weight:900;color:var(--green);animation:pop .25s}
.hint{margin-top:20px;font-size:19px;font-weight:800;color:var(--purple)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.blocks{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.bgroup .blbl{font-size:16px;color:var(--muted);margin-bottom:6px}
.blks{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;max-width:360px}
.ten{width:12px;height:80px;background:var(--blue);border-radius:4px;background-image:repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.55) 7px 8px)}
.one{width:12px;height:12px;background:var(--orange);border-radius:3px}
.endcard{background:#fff;border-radius:32px;padding:44px;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.bigemo{font-size:96px}
.endcard h2{font-size:38px;margin:8px 0;font-weight:900}
.endcard p{font-size:20px;font-weight:700}
/* chat */
.chat{background:#fff;border-radius:32px;padding:22px;box-shadow:0 6px 0 rgba(43,42,76,.07);display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:460px}
.msgs{flex:1;overflow-y:auto;padding:6px 6px 12px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:14px 18px;border-radius:22px;font-size:20px;font-weight:700;line-height:1.5;white-space:normal;word-wrap:break-word}
.msg.bot{background:#F5F0FF;border-bottom-left-radius:6px;align-self:flex-start;display:flex;gap:12px}
.msg.bot .av{flex:none}
.msg.me{background:#FFE8D8;border-bottom-right-radius:6px;align-self:flex-end}
.msg img{display:block;max-width:260px;max-height:220px;border-radius:14px;margin-bottom:8px}
.msg .sp{border:0;background:none;cursor:pointer;font-size:18px;padding:0 0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--line);background:#FFF7EA;border-radius:99px;padding:8px 14px;font-weight:800;font-size:15px;cursor:pointer}
.chip:hover{background:#FFEFD6}
.composer{display:flex;gap:10px;align-items:flex-end;border-top:3px solid #F6EEDD;padding-top:12px}
.composer textarea{flex:1;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font:inherit;font-size:19px;font-weight:700;resize:none;outline:none;background:#FFFDF8}
.composer textarea:focus{border-color:var(--purple)}
.photo{cursor:pointer;width:54px;height:54px;font-size:24px;border:0}
.mic.on{background:var(--pink);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,138,.5)}50%{box-shadow:0 0 0 10px rgba(255,92,138,0)}}
#imgprev img{height:70px;border-radius:12px;margin:6px 0;border:3px solid var(--line)}
#imgprev{display:flex;align-items:center;gap:10px}
.typing{opacity:.7}
/* settings */
.panel{background:#fff;border-radius:28px;padding:26px;box-shadow:0 6px 0 rgba(43,42,76,.07);margin-bottom:20px}
.panel h2{margin:0 0 14px;font-size:24px;font-weight:900}
.field{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0;font-weight:800;font-size:18px}
.field input,.field select{font:inherit;font-size:18px;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:#FFFDF8}
table{width:100%;border-collapse:collapse;font-size:18px;font-weight:700}
td,th{padding:10px 8px;border-bottom:2px solid #F6EEDD;text-align:left}
th{color:var(--muted);font-size:15px}
.mlist{max-height:240px;overflow:auto;font-weight:700;color:var(--muted);padding-left:20px;margin:8px 0}
.unitbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.unitchip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer}.unitchip:hover{background:#FFF1C9}
.onb{background:#fff;border-radius:28px;padding:26px;margin-bottom:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.onb input{font:inherit;font-size:22px;font-weight:800;border:3px solid var(--line);border-radius:16px;padding:12px 16px;min-width:220px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.ws{margin-top:16px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px;text-align:left;font-weight:700}
.wsh{font-size:19px;margin-bottom:10px}
.wsbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.wsstat{background:#FFF1C9;border-radius:99px;padding:8px 14px;font-size:17px}
.wsblocks{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;min-height:60px;padding:10px;background:#FFF7EA;border-radius:16px}
.wsten{width:22px;height:140px;border:0;border-radius:6px;background:var(--blue);background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(255,255,255,.6) 13px 14px);cursor:pointer;transition:transform .1s}
.wsone{width:22px;height:22px;border:0;border-radius:5px;background:var(--orange);cursor:pointer;transition:transform .1s}
.wsten:hover,.wsone:hover{transform:scale(1.12)}
.wsmsg{margin-top:12px;font-size:18px;color:var(--purple);font-weight:800;min-height:24px}
.wsq{font-size:22px;font-weight:900;margin-top:14px;text-align:center}
.wsopts{margin-top:10px}.wsopts .opt{font-size:22px;padding:12px}
.wsplates{display:flex;flex-wrap:wrap;gap:12px;min-height:90px;padding:10px;background:#FFF7EA;border-radius:16px}
.wsplate{background:#fff;border:3px solid #E6D9BF;border-radius:50%;width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .2s}
.wsdots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:70px}
.wsdots i{width:12px;height:12px;border-radius:50%;background:#B5651D;display:block}
.wscount{font-size:14px;font-weight:900;color:var(--muted);margin-top:4px}
.clockwrap{display:flex;justify-content:center;margin:10px 0}
.clock{user-select:none;-webkit-user-select:none}.clock.drag{cursor:grab;touch-action:none}.clock.drag:active{cursor:grabbing}
.grafitems{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:#FFF7EA;border-radius:16px;margin:10px 0}
.gi{font-size:34px;border:0;background:#fff;border-radius:12px;width:52px;height:52px;cursor:pointer;transition:transform .1s}.gi:hover:not(:disabled){transform:scale(1.15)}.gi.off{opacity:.15}
.ttab{margin:10px 0;font-size:18px}.ttab th{text-align:left;color:var(--muted);font-size:14px}.ttab td{padding:8px}
.tally{font-family:monospace;font-size:24px;letter-spacing:2px;color:var(--purple)}.t5{text-decoration:line-through;margin-right:8px}
.num{display:flex;align-items:center;gap:10px}.num button{width:34px;height:34px;border:0;border-radius:10px;background:#F1ECFF;font-size:20px;font-weight:900;cursor:pointer}.num b{min-width:24px;text-align:center;font-size:20px}
.graf{display:flex;gap:16px;align-items:flex-end;justify-content:center;padding:16px;background:#FFF7EA;border-radius:16px;min-height:200px;margin:10px 0;border-bottom:4px solid var(--ink)}
.gcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.gstack{display:flex;flex-direction:column-reverse;gap:2px;min-height:40px;justify-content:flex-start}.gstack span{font-size:26px;line-height:1}
.graf.small .gstack span{font-size:20px}
.gbtns{display:flex;gap:6px}.gbtns button{width:32px;height:32px;border:0;border-radius:10px;background:#F1ECFF;font-weight:900;font-size:18px;cursor:pointer}
.glbl{font-weight:800;font-size:15px;text-align:center}
.bookwrap{background:#fff;border-radius:24px;padding:12px;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.booknav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.booknav select{font:inherit;font-weight:700;border:3px solid var(--line);border-radius:12px;padding:8px 10px;max-width:360px}
.bkpg{display:flex;align-items:center;gap:6px;font-weight:800}.bkpg input{width:64px;font:inherit;font-weight:800;border:3px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.bookpage{overflow:auto;max-height:calc(100vh - 230px);text-align:center;background:#F3EAD8;border-radius:16px;padding:6px}
#bkc{box-shadow:0 4px 16px rgba(0,0,0,.15);border-radius:6px;background:#fff}
.vwrap{display:flex;justify-content:center;margin:14px 0}
.vt,table.ayir,.ttab.tahmin{width:auto}.vt td,table.ayir td{border-bottom:none}
.vt{border-collapse:collapse;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}
.vt td{width:46px;height:52px;text-align:center;padding:0}
.vt td.op{width:38px;color:var(--orange)}
.vt tr.res td:not(:first-child){border-top:4px solid var(--ink)}
.vt input.dg{width:42px;height:48px;font:inherit;text-align:center;border:3px solid var(--line);border-radius:10px;background:#FFFDF8;color:var(--ink);padding:0}
.vt input.dg:focus{border-color:var(--purple);outline:none}
.vt input.dg.ok{border-color:var(--green);background:#EFFAF4;color:#0E7A4C}.vt input.dg.no{border-color:var(--pink);background:#FFE1EA}
.vt tr.elde td{height:30px}.vt input.eb{width:28px;height:26px;font-size:16px;font-weight:900;text-align:center;border:2px dashed #D9C9A8;border-radius:6px;color:var(--purple);background:transparent;padding:0}
.esle{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.ecard{background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.ecard .vt{font-size:24px}.ecard .vt td{width:24px;height:30px}.ecard .vt td.op{width:20px}
.ecard.sel{border-color:var(--purple);box-shadow:0 0 0 4px #E6DEFF}
.eres{min-width:90px;font-size:28px;font-weight:900;padding:12px;border:3px solid var(--line);border-radius:14px;background:#FFF7EA;cursor:pointer;color:var(--ink)}
.story{background:#FFF7EA;border:3px dashed #E6D3AE;border-radius:18px;padding:16px 18px;text-align:left;font-size:21px;font-weight:700;line-height:1.6;margin:12px 0}
.story.zincir{text-align:center;font-size:28px;font-weight:900;line-height:1.8}
.steps .step{margin-top:16px;text-align:left;border-left:5px solid var(--line);padding:4px 0 4px 14px;animation:pop .25s}
.schip{display:inline-block;border-radius:99px;padding:4px 12px;font-weight:900;color:#fff;background:var(--blue);font-size:15px}
.schip.s-oku{background:#3D9BFF}.schip.s-planla{background:#8E6CEF}.schip.s-uygula{background:#20B072}.schip.s-kontrolet{background:#FF8A3D}.schip.s-tahmin{background:#8E6CEF}.schip.s-gerçek{background:#20B072}
.sq{font-size:21px;font-weight:800;margin:8px 0}
.sopts{margin-top:6px}.sopts .opt{font-size:20px;padding:12px}
.shint{color:var(--purple);font-weight:800;margin-top:8px;font-size:18px;line-height:1.5}
.ttab.tahmin{margin:10px auto;font-size:22px}.ttab.tahmin td{text-align:center;padding:8px 16px;border:2px solid var(--line)}
.kare{display:grid;grid-template-columns:repeat(3,66px) 70px;gap:6px;justify-content:center;font-size:28px;font-weight:900;margin:14px 0}
.kare .c{background:#fff;border:3px solid var(--blue);border-radius:10px;height:62px;display:grid;place-items:center}
.kare .c.q{background:#FFF1C9;color:var(--orange);border-color:var(--orange)}
.kare .s{color:var(--muted);font-size:17px;display:grid;place-items:center}
table.ayir{margin:14px auto;font-size:26px;font-weight:900}table.ayir td{padding:6px 8px}
table.ayir tr.res td{border-top:4px solid var(--ink)}
.ayin{width:52px;height:46px;font:inherit;font-size:24px;text-align:center;border:3px solid var(--line);border-radius:10px;background:#FFFDF8;padding:0}
.ayin.ok{border-color:var(--green);background:#EFFAF4}.ayin.no{border-color:var(--pink);background:#FFE1EA}
.msub{font-size:14px;text-transform:none;letter-spacing:0;color:var(--purple)}
.gtag{display:inline-block;margin-top:6px;background:#F1ECFF;color:var(--purple);border-radius:99px;padding:3px 10px;font-weight:900;font-size:13px}.gtag.on{background:#D8F5E8;color:#0E7A4C}
.walletbar{height:18px;background:#F3EAD8;border-radius:99px;overflow:hidden;max-width:420px;margin:12px auto}.walletbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange))}
.msec{font-size:17px;font-weight:900;color:var(--muted);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.grid.four{grid-template-columns:repeat(4,1fr)}
.card.mini{flex-direction:column;justify-content:center;text-align:center;gap:8px;padding:18px 10px}.card.mini .emo{width:72px;height:72px;font-size:40px}.card.mini h3{font-size:21px}
.card.tall{flex-direction:column;text-align:center;gap:10px;padding:20px 14px}.card.tall .emo{width:70px;height:70px;font-size:38px}.card.tall h3{font-size:20px}.card.tall p{font-size:14px}
.mchips{display:flex;flex-wrap:wrap;gap:10px}
.mchip{border:3px solid var(--line);background:#fff;border-radius:99px;padding:10px 18px;font-weight:800;font-size:17px;cursor:pointer}.mchip:hover{background:#FFF1C9}
@media (max-width:760px){.grid.four{grid-template-columns:1fr 1fr}}
.zbadge{position:absolute;top:14px;right:18px;font-size:18px;background:#FFF7EA;border-radius:99px;padding:2px 10px}
.zor{display:inline-block;background:#FFE1EA;color:#B3123F;border-radius:99px;padding:2px 12px;font-size:17px;vertical-align:middle}.zor.orta{background:#FFF1C9;color:#9A6B00}
.upd{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2B2A4C;color:#fff;padding:12px 18px;border-radius:99px;font-weight:900;font-size:17px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s}
.gwrap{position:relative;background:#fff;border-radius:32px;padding:12px;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.gq{text-align:center;font-size:38px;font-weight:900;min-height:48px;letter-spacing:1px}
.glvl{text-align:center;color:var(--muted);font-weight:800;margin-bottom:6px}
#gc{display:block;width:100%;border-radius:22px;cursor:crosshair;touch-action:none}
.seg{display:flex;background:#F1ECFF;border-radius:99px;padding:4px}.seg button{border:0;background:none;border-radius:99px;padding:8px 16px;font-weight:900;font-size:16px;cursor:pointer}.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}

<script>
/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const strip = s => String(s).replace(/\*\*/g, '');
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let VIEW = 'home';

/* ---------- kayıt ---------- */
const APP_VERSION = '20261107.2134';
const KEY = 'odev-arkadasi-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
let S = Object.assign({ name: '', unit: {}, wallet: 0, gameCost: 5, gameLock: true, stars: 0, goal: 10, day: '', dayStars: 0, stats: {}, mistakes: [], sound: true, rate: 1.15, autoRead: true, voice: '' }, load() || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function rollDay() { if (S.day !== today()) { S.day = today(); S.dayStars = 0; save(); } }
function addStar(fromGame, n) { n = Math.max(1, n || 1); rollDay(); const d0 = S.dayStars, w0 = S.wallet || 0; S.stars += n; S.dayStars += n; if (!fromGame) { S.wallet = w0 + n; if (S.gameLock && w0 < S.gameCost && S.wallet >= S.gameCost) toast('🎮 Oyun hakkı kazandın! Oyunlar seni bekliyor.'); } save(); updateHeader(); if (d0 < S.goal && S.dayStars >= S.goal) setTimeout(() => { confetti(); sfx('win'); }, 300); }
const ZPTS = z => z >= 3 ? 3 : z === 2 ? 2 : 1;
function stat(mod, ok) { const s = S.stats[mod] || (S.stats[mod] = { c: 0, w: 0 }); ok ? s.c++ : s.w++; save(); }
function addMistake(it) { if (!S.mistakes.some(m => m.key === it.key)) { S.mistakes.unshift(JSON.parse(JSON.stringify(it))); S.mistakes = S.mistakes.slice(0, 60); save(); } }
function removeMistake(key) { S.mistakes = S.mistakes.filter(m => m.key !== key); save(); }
function updateHeader() {
  rollDay();
  $('#starPill').textContent = '⭐ ' + (S.gameLock ? (S.wallet || 0) : S.stars); $('#starPill').title = S.gameLock ? 'Harcanabilir yıldızların (oyun için)' : 'Toplam yıldız';
  const done = Math.min(S.dayStars, S.goal);
  $('#goalTxt').textContent = S.dayStars >= S.goal ? `Bugünkü hedef tamam! 🎉 (${S.dayStars} ⭐)` : `Bugünkü hedef: ${done} / ${S.goal} ⭐`;
  $('#goalBar').style.width = (done / S.goal * 100) + '%';
}

function toast(msg) { const d = document.createElement('div'); d.className = 'upd'; d.style.bottom = '80px'; d.textContent = msg; document.body.appendChild(d); try { speak(msg); } catch (e) {} setTimeout(() => d.remove(), 3500); }
function payGame(start, name) {
  if (!S.gameLock) return start();
  const w = S.wallet || 0, c = S.gameCost;
  if (w >= c) { S.wallet = w - c; save(); updateHeader(); sfx('win'); return start(); }
  VIEW = 'locked'; stopSpeak(); app.classList.remove('wide');
  app.innerHTML = `<div class="endcard center"><div class="bigemo">🔒</div><h2>${esc(name)} için ${c} ⭐ gerekli</h2>
    <p>Sende <b>${w} ⭐</b> var. <b>${c - w} ⭐</b> daha kazan, oyun açılsın! <br><span class="muted small">Kolay soru 1 ⭐ · orta soru 2 ⭐ · zor soru 3 ⭐</span></p>
    <div class="walletbar"><i style="width:${Math.round(w / c * 100)}%"></i></div>
    <div class="row center"><button class="btn primary" data-a="play" data-v="bank:matematik:0">📖 Matematik Kitap Soruları</button><button class="btn green" data-a="play" data-v="bank:turkce:0">📖 Türkçe Kitap Soruları</button><button class="btn soft" data-a="menu" data-v="fas">📙 Fasikül Alıştırmaları</button><button class="btn soft" data-a="home">Ana sayfa 🏠</button></div></div>`;
  speak(`${name} için ${c} yıldız gerekli. ${c - w} yıldız daha kazan! Zor sorular daha çok yıldız getirir.`);
}
/* ---------- ses, konuşma, konfeti ---------- */
let AC;
function sfx(t) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ok: [660, 880], win: [523, 659, 784, 1046], no: [240, 190], tick: [520] }[t] || [440];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * .12;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.22, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .25);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + .3);
    });
  } catch (e) {}
}
function trVoices() { try { return speechSynthesis.getVoices().filter(v => /^tr/i.test(v.lang)); } catch (e) { return []; } }
function bestVoice() {
  const vs = trVoices(); if (!vs.length) return null;
  if (S.voice) { const v = vs.find(v => v.name === S.voice); if (v) return v; }
  const score = v => (/yelda/i.test(v.name) ? 40 : 0) + (/premium|enhanced|geliştirilmiş|premium/i.test(v.name) ? 20 : 0) + (/google/i.test(v.name) ? 10 : 0) + (v.localService ? 5 : 0);
  return vs.slice().sort((a, b) => score(b) - score(a))[0];
}
function forSpeech(t) {
  return strip(t)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{1F900}-\u{1F9FF}]/gu, '')
    .replace(/×/g, ' çarpı ').replace(/÷/g, ' bölü ').replace(/−/g, ' eksi ').replace(/\+/g, ' artı ').replace(/▢/g, ' boşluk ').replace(/= \?/g, ' kaç eder').replace(/=/g, ' eşittir ')
    .replace(/\s*·\s*/g, ', ').replace(/\s{2,}/g, ' ').trim();
}
function sfxExhaust() {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate * .12, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    for (let k = 0; k < 5; k++) {
      const src = AC.createBufferSource(); src.buffer = buf; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500 - k * 50;
      const g = AC.createGain(); g.gain.value = .5; src.connect(f).connect(g).connect(AC.destination); src.start(AC.currentTime + k * .14);
    }
  } catch (e) {}
}
function speak(t, opts) {
  opts = opts || {};
  try {
    const s = window.speechSynthesis; if (!s) return; s.cancel();
    const txt = forSpeech(t); if (!txt) return;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'tr-TR'; u.rate = opts.rate || S.rate || 1.15; u.pitch = 1.05;
    const v = bestVoice(); if (v) u.voice = v;
    if (opts.onend) u.onend = opts.onend;
    s.speak(u);
  } catch (e) {}
}
function autoSpeak(t) { if (S.autoRead) speak(t); }
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- sesle konuşma (mikrofon) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function listen(onText, onState) {
  if (!SR) { onState('nosupport'); return; }
  if (listening) { try { rec.stop(); } catch (e) {} return; }
  stopSpeak();
  rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalT = '';
  rec.onstart = () => { listening = true; onState('on'); };
  rec.onresult = e => { let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) finalT += e.results[i][0].transcript; } onText(finalT || t, false); };
  rec.onerror = e => { listening = false; onState(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied' : e.error === 'no-speech' ? 'nospeech' : 'err'); };
  rec.onend = () => { const was = listening; listening = false; onState('off'); if (was && finalT.trim()) onText(finalT.trim(), true); };
  try { rec.start(); } catch (e) { listening = false; onState('err'); }
}
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#FF8A3D', '#3D9BFF', '#20B072', '#8E6CEF', '#FF5C8A', '#FFC93C'];
  const P = Array.from({ length: 150 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, r: 5 + Math.random() * 6, c: pick(cols), a: Math.random() * 6 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.a += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); x.restore(); });
    if (++f < 200) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- içerik: MEB 2. sınıf ---------- */
/* MEB Türkiye Yüzyılı Maarif Modeli 2. sınıf tema haritası (tymm.meb.gov.tr öğretim programlarından özetlenmiştir) */
const MEB2 = {"matematik":{"ad":"Matematik","temalar":[{"no":1,"ad":"Nesnelerin Geometrisi (1)","sure":"25 ders saati","kavramlar":["daire","küp","kare prizma","dikdörtgen prizma","üçgen prizma","küre","dik dairesel silindir"],"kazanimlar":["MAT.2.3.1 Günlük yaşamdaki nesneleri biçimsel özelliklerine göre geometrik cisim olarak sınıflandırma ve adlandırma.","MAT.2.3.2 Geometrik cisim modelleriyle özgün yapılar oluşturma.","MAT.2.3.3 Geometrik şekillerle özgün modeller oluşturma.","MAT.2.3.4 Şekil ve cisimlerin yön, konum veya boyutu değişse de biçimsel özelliklerinin değişmediğini yorumlama.","MAT.2.3.5 Standart olmayan araçlarla sıvı miktarını tahmin etme ve ölçerek tahminini değerlendirme."],"icerik":["Geometrik cisimler","Geometrik cisim modelleri","Geometrik şekil modelleri","Şekil ve cisimlerin biçimsel özellikleri","Sıvı miktarını tahmin etme"],"genellemeler":["Bazı nesneler geometrik cisimlerle ilişkilidir.","Yapılar geometrik cisimlerden oluşur.","Şekil ve cisimlerin biçimsel özellikleri yön, konum veya boyut değişince değişmez.","Sıvının gerçek miktarı kullanılan ölçme aracından bağımsızdır."],"kitap":"1. Kitap","sayfa":"10-53","konular":["Geometrik Cisimler (s.12)","Geometrik Cisim Modelleri (s.22)","Geometrik Şekil Modelleri (s.27)","Geometrik Şekil ve Cisimlerin Biçimsel Özellikleri (s.35)","Sıvı Miktarını Tahmin Etme (s.42)"],"terimler":["köşeli cisimler / yuvarlak cisimler","küp, kare prizma, dikdörtgen prizma, üçgen prizma, küre, silindir, koni","kare, dikdörtgen, üçgen, çember, daire","biçimsel özellik (yer, yön, büyüklük değişse de biçim değişmez)"],"yontemler":["Çevredeki nesneleri geometrik cisimlere benzetme (top → küre, kutu → dikdörtgen prizma)","Dokunarak cismi tanıma oyunu","Modellerdeki şekilleri sayma ve eşleştirme"]},{"no":2,"ad":"Sayılar ve Nicelikler (1)","sure":"41 ders saati","kavramlar":["sayı doğrusu","basamak değeri","çözümleme","onluk","birlik","şekil örüntüleri"],"kazanimlar":["MAT.2.1.1 100'e kadar niceliklerin büyüklüklerini say   const s = new Set();
  const sw = +String(ans).split('').reverse().join('');
  shuffle([ans + 1, ans - 1, ans + 10, ans - 10, ans + 2, ans - 2, sw]).forEach(v => { if (v >= 0 && v !== ans && s.size < 3) s.add(v); });
  while (s.size < 3) { const v = ans + rand(3, 12); if (v !== ans) s.add(v); }

}

/* ---------- Kitap soru bankası (bank.json) + zorluk motoru ---------- */
let BANK = null, bankP = null;
function loadBank() {
  if (bankP) return bankP;
  bankP = (async () => { try { const r = await fetch('bank.json?v=' + APP_VERSION, { cache: 'no-store' }); BANK = await r.json(); } catch (e) { BANK = window.BANK_INLINE || null; } return BANK; })();
  return bankP;
}
function lvlOf(mod) { return ((S.lvl || {})[mod]) || 1; }
function lvlBump(mod, ok) {
  S.lvl = S.lvl || {}; S.streak = S.streak || {}; const st = S.streak[mod] || { ok: 0, no: 0 };
  if (ok) { st.ok++; st.no = 0; if (st.ok >= 3 && lvlOf(mod) < 3) { S.lvl[mod] = lvlOf(mod) + 1; st.ok = 0; speak('Seviye atladın! Sorular biraz zorlaşıyor.'); sfx('win'); } }
  else { st.no++; st.ok = 0; if (st.no >= 2 && lvlOf(mod) > 1) { S.lvl[mod] = lvlOf(mod) - 1; st.no = 0; } }
  S.streak[mod] = st; save();
}
function evalExpr(expr, v) {
  const e = String(expr).replace(/[a-z]+/g, m => (m in v ? v[m] : 'NaN'));
  if (!/^[\d+\-*() .]+$/.test(e)) return NaN;
  try { return Function('return (' + e + ')')(); } catch (x) { return NaN; }
}
function instSablon(q) {
  for (let t = 0; t < 60; t++) {
    const v = {}; for (const [k, r] of Object.entries(q.degiskenler || {})) v[k] = rand(+r[0], +r[1]);
    for (const [k, ex] of Object.entries(q.hesapla || {})) v[k] = evalExpr(ex, v);
    if (q.kisit) { const ok = q.kisit.split(/\s*(?:,|&&|;)\s*/).every(c => { const m = c.match(/^(.+?)(<=|>=|<|>|==|!=)(.+)$/); if (!m) return true; const a = evalExpr(m[1], v), b = evalExpr(m[3], v); return { '<': a < b, '>': a > b, '<=': a <= b, '>=': a >= b, '==': a == b, '!=': a != b }[m[2]]; }); if (!ok) continue; }
    const ans = evalExpr(q.cevap, v); if (!Number.isInteger(ans) || ans < 0 || ans > 999) continue;
    v.cevap = ans; const fill = s => String(s).replace(/\{([a-z]+)\}/g, (m, k) => (k in v ? v[k] : m));
    return { prompt: fill(q.soru), answer: String(ans), explain: fill(q.aciklama || ''), options: makeOpts(ans) };
  }
  return null;
}
function bankToItem(q, mod, konu) {
  const base = { mod, zorluk: q.zorluk || 1, emoji: q.emoji, konu, key: 'b:' + (q.soru || '').slice(0, 60) };
  if (q.tip === 'sablon') { const i = instSablon(q); if (!i) return null; return Object.assign(base, { kind: 'mcq' }, i, { key: 'b:' + i.prompt }); }
  if (q.tip === 'dy') return Object.assign(base, { kind: 'mcq', prompt: 'Doğru mu, yanlış mı? "' + q.soru + '"', options: ['Doğru ✅', 'Yanlış ❌'], answer: q.cevap === 'D' ? 'Doğru ✅' : 'Yanlış ❌', explain: q.aciklama || '' });
  if (q.tip === 'siralama') return Object.assign(base, { kind: 'hece', word: (q.parcalar || []).join(' '), parts: q.parcalar || [], label: q.soru, explain: q.aciklama || '', en: mod === 'bilgi' && /^[A-Za-z?'., !]+$/.test((q.parcalar || []).join(' ')) ? (q.parcalar || []).join(' ') : undefined, tr: q.soru });
  if (q.tip === 'mcq' || q.tip === 'bosluk') { const opts = (q.secenekler || []).slice(); if (!opts.includes(q.cevap)) opts.push(q.cevap); return Object.assign(base, { kind: 'mcq', prompt: q.soru, options: shuffle(opts).slice(0, 4).includes(q.cevap) ? shuffle(opts).slice(0, 4) : shuffle([q.cevap, ...opts.filter(o => o !== q.cevap).slice(0, 3)]), answer: q.cevap, explain: q.aciklama || '' }); }
  return null;
}
function bankItems(ders, tema, n, mod) {
  if (!BANK || !BANK[ders]) return [];
  const lvl = lvlOf(mod + ':' + ders);
  const konular = BANK[ders].konular.filter(k => !tema || k.tema === tema);
  let pool = konular.flatMap(k => k.sorular.map(q => ({ q, konu: k.konu })));
  if (!pool.length) return [];
  const w = q => (q.zorluk || 1) === lvl ? 6 : (q.zorluk || 1) < lvl ? 2.5 : 1.2;
  const items = [], used = new Set();
  for (let t = 0; t < n * 20 && items.length < n; t++) {
    const tot = pool.reduce((a, x) => a + w(x.q), 0); let r = Math.random() * tot, pick_ = pool[0];
    for (const x of pool) { r -= w(x.q); if (r <= 0) { pick_ = x; break; } }
    const it = bankToItem(pick_.q, mod, pick_.konu); if (!it || used.has(it.key)) continue; used.add(it.key); items.push(it);
    if (pick_.q.tip !== 'sablon') pool = pool.filter(x => x !== pick_); else { pick_.n = (pick_.n || 0) + 1; if (pick_.n >= 2) pool = pool.filter(x => x !== pick_); }
  }
  return items;
}
async function bankPlay(ders, tema, mod, title) {
  await loadBank();
  const items = bankItems(ders, tema, 10, mod);
  if (!items.length) { app.innerHTML = `<div class="rtop"><button class="btn soft sm" data-a="home">← Ana sayfa</button></div><div class="qcard"><div class="qemo">📖</div><div class="qtext">Bu konu için kitap soruları henüz yüklenmedi.</div><p class="muted">Birkaç dakika sonra tekrar dene.</p></div>`; return; }
  startRound(title + ' · Seviye ' + lvlOf(mod + ':' + ders), items, false, 'bank:' + ders + ':' + (tema || 0));
  R.bankMod = mod + ':' + ders;
}

/* Çıkarma: a − b — blokları tıklayıp çıkar, gerekirse onluğu boz */
function buildSubWS(a, b, host, onDone) {
  const st = { tens: Math.floor(a / 10), ones: a % 10, removed: 0, done: false };
  const render = () => {
    const left = b - st.removed, remain = a - st.removed;
    host.innerHTML = `<div class="ws"><div class="wsh">🧮 <b>${a} − ${b}</b> → ${a} sayısından <b>${b}</b> tane çıkaralım. Bloklara tıkla!</div>
      <div class="wsbar"><span class="wsstat">Çıkarılan: <b>${st.removed}</b> / ${b}</span><span class="wsstat">Kalan: <b>${remain}</b></span>${st.tens > 0 && left > 0 && left < 10 && st.ones < left ? '<button class="btn primary sm" id="wsbreak">✂️ Onluğu boz</button>' : st.tens > 0 && left > 0 ? '<button class="btn soft sm" id="wsbreak">✂️ Onluğu boz</button>' : ''}</div>
      <div class="wsblocks">${Array.from({ length: st.tens }, () => '<button class="wsten" title="10 çıkar"></button>').join('')}${Array.from({ length: st.ones }, () => '<button class="wsone" title="1 çıkar"></button>').join('')}</div>
      <div class="wsmsg" id="wsmsg">${left === 0 ? `Bitti! ${a} − ${b} işleminde kalan blokları say 👇` : st.ones < left && left < 10 && st.tens > 0 ? 'Birlikler yetmiyor! Bir onluğu boz ✂️' : left >= 10 ? 'Bir onluk çubuğa tıkla: 10 tane birden çıkar!' : 'Birlik küplerine tıkla.'}</div><div id="wsans"></div></div>`;
    host.querySelectorAll('.wsten').forEach(el => el.onclick = () => { if (left < 10) { el.classList.add('shake'); sfx('no'); $('#wsmsg', host).textContent = `Sadece ${left} tane kaldı, 10 çok fazla! Onluğu boz ✂️`; return; } st.tens--; st.removed += 10; sfx('tick'); render(); });
    host.querySelectorAll('.wsone').forEach(el => el.onclick = () => { if (left <= 0) return; st.ones--; st.removed++; sfx('tick'); render(); });
    const br = $('#wsbreak', host); if (br) br.onclick = () => { st.tens--; st.ones += 10; sfx('win'); speak('Bir onluk, on birlik oldu.'); render(); };
    if (left === 0 && !st.done) { st.done = true; speak(`Kalan blokları say.`); wsOptions(a - b, () => { $('#wsmsg', host).textContent = `Evet! ${a} − ${b} = ${a - b} 🎉`; speak(`${a} eksi ${b} eşittir ${a - b}. Harikasın!`); onDone(); }, $('#wsans', host)); }
  };
  render();
}
/* Çarpma: a × b — a tane grup kur, her grupta b tane */
function buildMulWS(a, b, host, onDone) {
  const st = { g: 0, done: false };
  const render = () => {
    host.innerHTML = `<div class="ws"><div class="wsh">🍪 <b>${a} × ${b}</b> → "<b>${a} kere ${b}</b>" demek: ${a} tabak, her tabakta ${b} kurabiye. Tabak ekle!</div>
      <div class="wsbar"><button class="btn primary sm" id="wsadd">+ Tabak ekle (${b} tane)</button><button class="btn soft sm" id="wsrem" ${st.g ? '' : 'disabled'}>− Tabak al</button><span class="wsstat">${st.g} tabak × ${b} = <b>${st.g * b}</b></span></div>
      <div class="wsplates">${Array.from({ length: st.g }, (_, i) => `<div class="wsplate"><div class="wsdots">${'<i></i>'.repeat(b)}</div><div class="wscount">${(i + 1) * b}</div></div>`).join('')}</div>
      <div class="wsmsg" id="wsmsg">${st.g < a ? `${a - st.g} tabak daha!` : `${a} tabak tamam! Ritmik say: ${Array.from({ length: a }, (_, i) => (i + 1) * b).join(', ')} 🥁`}</div><div id="wsans"></div></div>`;
    $('#wsadd', host).onclick = () => { if (st.g >= a) { $('#wsmsg', host).textContent = `${a} tabak yeter! ${a} kere ${b} dedik.`; sfx('no'); return; } st.g++; sfx('tick'); speak(String(st.g * b)); render(); };
    $('#wsrem', host).onclick = () => { if (st.g > 0) { st.g--; sfx('tick'); render(); } };

  };

}
function wsFor(prompt, host, onDone) {

async function shrink(file) {
  const url = URL.createObjectURL(file); const img = new Image();
  await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; });
  const m = 1400, sc = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  return { blob, url };
}

async function send(text) {
  text = (text || '').trim();
  if (busy || (!text && !pending)) return;
  if (!text) text = 'Bu ödevde bana yardım eder misin?';
  const sample = await getSample();
  if (!sample) { $('#nos').innerHTML = 'Bilge şu an bağlı değil. Bir büyüğün <b>Veli Köşesi ⚙️</b>nden Bilge\'yi açması gerekiyor 🎮'; return; }
  const u = { role: 'user', text };
  if (pending) { chatImg = pending.blob; u.img = pending.url; u.hasImg = true; pending = null; $('#imgprev').innerHTML = ''; }
  chat.push(u);
  const bot = { role: 'assistant', text: '' }; chat.push(bot); busy = true; renderMsgs();
  // geçmişi kur: hatalı cevapları çıkar, aynı rolleri birleştir, kuralları ilk mesaja ekle
  const hist = [];
  chat.slice(0, -1).filter(m => !m.err).forEach(m => {
    const c = m.text + (m.hasImg ? '\n[Ödevimin fotoğrafını ekledim]' : '');
    const last = hist[hist.length - 1];
    if (last && last.role === m.role) last.content += '\n' + c; else hist.push({ role: m.role, content: c });
  });
  hist[0].content = bilgeRules() + '\n\n---\nÇocuğun mesajı:\n' + hist[0].content;
  try {
    const opts = { cache: false, onText: ({ text }) => { bot.text = text; const l = $('#last'); if (l) { l.innerHTML = botHTML(text, true); $('#msgs').scrollTop = 1e9; } } };
    if (chatImg && imgOK) opts.images = [chatImg];

    if (VIEW === 'help') autoSpeak(bot.text);
  } catch (err) {
    bot.err = true;
    bot.text = err && err.code === 'rate_limited' ? 'Biraz dinlenmem lazım 😴 Bir dakika sonra tekrar dener misin?'
      : err && err.code === 'not_granted' ? (S.apiKey && !(window.claude && window.claude.use) ? 'Anahtarım çalışmadı 🔑 Bir büyüğün Veli Köşesi\'nden kontrol etmesi gerekiyor.' : 'Konuşabilmem için izin gerekiyor. Bir büyüğünden izin vermesini iste 🙏')
      : err && err.code === 'network' ? 'İnternete bağlanamadım 📡 Bağlantıyı kontrol edip tekrar dener misin?'
      : 'Hımm, bir sorun oldu. Tekrar dener misin? 🙈' + (err && err.message ? ` (${err.message})` : '');
  }
  busy = false; renderMsgs();
  const ti = $('#ti'); if (ti) ti.focus();
}

          : st === 'nospeech' ? 'Ses duyamadım, bir daha dener misin? 🎤' : st === 'nosupport' ? 'Bu tarayıcıda sesle konuşma yok; yazarak sorabilirsin ✍️' : st === 'err' ? 'Mikrofon şu an çalışmadı, yazarak sorabilirsin ✍️' : '';

  cmode: v => { S.carMode = v; save(); carStart(); },

    catch (e) { r.textContent = '❌ ' + (e.code === 'not_granted' ? 'Anahtar kabul edilmedi' : 'Bağlanamadı') + (e.message ? ' — ' + e.message : '') + ` (anahtar ${S.apiKey.length} karakter, "${S.apiKey.slice(0, 11)}…" ile başlıyor)`; }

  ask: () => {

      : `Bu soruda yanıldım: "${it.prompt}". Ben "${val}" dedim ama doğrusu "${it.answer}". Neden böyle olduğunu bana anlatır mısın?`;
    R.savedHTML = app.innerHTML; stopSpeak();
    chat = []; chatImg = null; pending = null; help(t);
  },
  backq: () => { if (!R || !R.savedHTML) return home(); stopSpeak(); VIEW = 'round'; app.innerHTML = R.savedHTML; R.savedHTML = null; },
  setname: () => { const v = ($('#nm') || {}).value; if (v && v.trim()) { S.name = v.trim(); save(); home(); } },
  clrm: () => { S.mistakes = []; save(); settings(); },
  lvlreset: () => { S.lvl = {}; S.streak = {}; save(); settings(); },
  reset: (v, el) => {

};

  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }); const t = await r.text();
