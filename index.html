<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödev Arkadaşı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EA;--ink:#2B2A4C;--muted:#6E6C8C;--card:#fff;--orange:#FF8A3D;--blue:#3D9BFF;--green:#20B072;--purple:#8E6CEF;--pink:#FF5C8A;--yellow:#FFC93C;--line:#F0E3CC}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 28px;background:#fff;border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;cursor:pointer;background:none;border:0;padding:0}
.goal{flex:1;max-width:360px;margin-left:auto}
.goal small{display:block;font-weight:800;color:var(--muted);margin-bottom:4px;font-size:14px}
.bar{height:14px;background:#F3EAD8;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:99px;transition:width .5s}
.pill{background:#FFF1C9;border-radius:99px;padding:8px 16px;font-weight:900;font-size:18px;white-space:nowrap}
.iconbtn{border:0;background:#F1ECFF;border-radius:14px;width:46px;height:46px;font-size:21px;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:#E6DEFF}
.iconbtn.sm{width:38px;height:38px;font-size:17px;border-radius:12px;vertical-align:middle;margin-left:8px}
main{max-width:1100px;margin:0 auto;padding:28px}
h1{font-size:34px;margin:4px 0 6px;font-weight:900}
.lead{color:var(--muted);font-weight:700;font-size:19px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border-radius:28px;padding:24px;border:3px solid transparent;box-shadow:0 6px 0 rgba(43,42,76,.07);cursor:pointer;transition:transform .15s,border-color .15s;display:flex;gap:18px;align-items:center;text-align:left;width:100%}
.card:hover{transform:translateY(-3px);border-color:var(--line)}
.card:disabled{opacity:.6;cursor:default;transform:none}
.card .emo{font-size:48px;width:86px;height:86px;border-radius:24px;display:grid;place-items:center;flex:none}
.card h3{margin:0 0 4px;font-size:25px;font-weight:900}
.card p{margin:0;color:var(--muted);font-weight:700;font-size:16px}
.wide{grid-column:1/-1}
.c-orange .emo{background:#FFE8D8}.c-blue .emo{background:#DDEEFF}.c-green .emo{background:#D8F5E8}.c-purple .emo{background:#ECE5FF}.c-pink .emo{background:#FFE1EA}.c-yellow .emo{background:#FFF1C9}
.hero{background:linear-gradient(120deg,#8E6CEF,#B08CFF);color:#fff}
.hero p{color:#F1EBFF}.hero .emo{background:rgba(255,255,255,.2)}
.hero:hover{border-color:#fff}
.btn{border:0;border-radius:18px;padding:14px 22px;font-weight:900;font-size:18px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 #E06A1F}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #148A57}
.btn.soft{background:#F1ECFF;color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:16px;border-radius:14px}
.btn.danger{background:#FFE1EA;color:#B3123F}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.center{text-align:center;justify-content:center}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px}
/* round */
.rtop{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.rtitle{font-weight:900;font-size:24px;flex:1}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:#EADFC9;display:block}
.dots i.now{background:var(--orange);transform:scale(1.2)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--pink)}
.qcard{background:#fff;border-radius:32px;padding:34px;box-shadow:0 6px 0 rgba(43,42,76,.07);text-align:center}
.qemo{font-size:72px;line-height:1;margin-bottom:10px}
.qtext{font-size:30px;font-weight:900;margin-bottom:8px}
.qtext.big{font-size:56px;letter-spacing:1px}
.qsub{font-size:20px;color:var(--muted);font-weight:700;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.opts.n2{grid-template-columns:1fr 1fr}
.opt{background:#FFF7EA;border:3px solid var(--line);border-radius:22px;padding:20px 14px;font-size:26px;font-weight:900;cursor:pointer;transition:transform .1s,background .2s}
.opt:hover:not(:disabled){background:#FFEFD6;transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.ok{background:#D8F5E8;border-color:var(--green);color:#0E7A4C}
.opt.no{background:#FFE1EA;border-color:var(--pink);color:#B3123F}
.opt .k{display:inline-block;font-size:14px;color:var(--muted);background:#fff;border-radius:8px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.sylls{display:flex;justify-content:center;flex-wrap:wrap}
.syl{min-width:120px;font-size:32px}
.syl.used{opacity:.25}
.slots{display:flex;gap:10px;justify-content:center;margin:20px 0 4px;flex-wrap:wrap}
.slot{min-width:110px;height:72px;border:3px dashed #E2D3B6;border-radius:20px;display:grid;place-items:center;font-size:32px;font-weight:900}
.slot.filled{border-style:solid;border-color:var(--green);background:#EFFAF4}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.explain{margin-top:24px;background:#F5F0FF;border-radius:24px;padding:20px 24px;text-align:left;font-size:20px;font-weight:700;line-height:1.5;animation:pop .25s}
.exh{font-weight:900;color:var(--purple);margin-bottom:6px}
.praise{margin-top:22px;font-size:30px;font-weight:900;color:var(--green);animation:pop .25s}
.hint{margin-top:20px;font-size:19px;font-weight:800;color:var(--purple)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.blocks{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.bgroup .blbl{font-size:16px;color:var(--muted);margin-bottom:6px}
.blks{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;max-width:360px}
.ten{width:12px;height:80px;background:var(--blue);border-radius:4px;background-image:repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.55) 7px 8px)}
.one{width:12px;height:12px;background:var(--orange);border-radius:3px}
.endcard{background:#fff;border-radius:32px;padding:44px;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.bigemo{font-size:96px}
.endcard h2{font-size:38px;margin:8px 0;font-weight:900}
.endcard p{font-size:20px;font-weight:700}
/* chat */
.chat{background:#fff;border-radius:32px;padding:22px;box-shadow:0 6px 0 rgba(43,42,76,.07);display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:460px}
.msgs{flex:1;overflow-y:auto;padding:6px 6px 12px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:14px 18px;border-radius:22px;font-size:20px;font-weight:700;line-height:1.5;white-space:normal;word-wrap:break-word}
.msg.bot{background:#F5F0FF;border-bottom-left-radius:6px;align-self:flex-start;display:flex;gap:12px}
.msg.bot .av{flex:none}
.msg.me{background:#FFE8D8;border-bottom-right-radius:6px;align-self:flex-end}
.msg img{display:block;max-width:260px;max-height:220px;border-radius:14px;margin-bottom:8px}
.msg .sp{border:0;background:none;cursor:pointer;font-size:18px;padding:0 0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--line);background:#FFF7EA;border-radius:99px;padding:8px 14px;font-weight:800;font-size:15px;cursor:pointer}
.chip:hover{background:#FFEFD6}
.composer{display:flex;gap:10px;align-items:flex-end;border-top:3px solid #F6EEDD;padding-top:12px}
.composer textarea{flex:1;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font:inherit;font-size:19px;font-weight:700;resize:none;outline:none;background:#FFFDF8}
.composer textarea:focus{border-color:var(--purple)}
.photo{cursor:pointer;width:54px;height:54px;font-size:24px;border:0}
.mic.on{background:var(--pink);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,138,.5)}50%{box-shadow:0 0 0 10px rgba(255,92,138,0)}}
#imgprev img{height:70px;border-radius:12px;margin:6px 0;border:3px solid var(--line)}
#imgprev{display:flex;align-items:center;gap:10px}
.typing{opacity:.7}
/* settings */
.panel{background:#fff;border-radius:28px;padding:26px;box-shadow:0 6px 0 rgba(43,42,76,.07);margin-bottom:20px}
.panel h2{margin:0 0 14px;font-size:24px;font-weight:900}
.field{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0;font-weight:800;font-size:18px}
.field input,.field select{font:inherit;font-size:18px;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:#FFFDF8}
table{width:100%;border-collapse:collapse;font-size:18px;font-weight:700}
td,th{padding:10px 8px;border-bottom:2px solid #F6EEDD;text-align:left}
th{color:var(--muted);font-size:15px}
.mlist{max-height:240px;overflow:auto;font-weight:700;color:var(--muted);padding-left:20px;margin:8px 0}
.onb{background:#fff;border-radius:28px;padding:26px;margin-bottom:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.onb input{font:inherit;font-size:22px;font-weight:800;border:3px solid var(--line);border-radius:16px;padding:12px 16px;min-width:220px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.upd{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2B2A4C;color:#fff;padding:12px 18px;border-radius:99px;font-weight:900;font-size:17px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s}
.gwrap{position:relative;background:#fff;border-radius:32px;padding:16px;box-shadow:0 6px 0 rgba(43,42,76,.07)}
.gq{text-align:center;font-size:40px;font-weight:900;min-height:52px;letter-spacing:1px}
.glvl{text-align:center;color:var(--muted);font-weight:800;margin-bottom:8px}
#gc{display:block;width:100%;border-radius:22px;cursor:crosshair;touch-action:none}
.gover{position:absolute;inset:16px;background:rgba(255,255,255,.94);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.gover h2{font-size:38px;margin:6px 0;font-weight:900}.gover p{font-size:20px;font-weight:700;max-width:520px}
@media (max-width:760px){
  header{padding:10px 14px;gap:10px;flex-wrap:wrap}.brand span{display:none}
  main{padding:16px}.grid,.grid.three{grid-template-columns:1fr}
  .qcard{padding:22px}.qtext.big{font-size:42px}.opt{font-size:22px}.msg{max-width:92%;font-size:18px}
  .dots{display:none}
}
</style>
</head>
<body>
<header>
  <button class="brand" data-a="home" aria-label="Ana sayfa">
    <svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true"><path d="M20 20 L36 34 L20 42Z M80 20 L64 34 L80 42Z" fill="#6F4FD8"/><ellipse cx="50" cy="58" rx="34" ry="36" fill="#8E6CEF"/><ellipse cx="50" cy="71" rx="20" ry="21" fill="#EDE6FF"/><circle cx="36" cy="46" r="13" fill="#fff"/><circle cx="64" cy="46" r="13" fill="#fff"/><circle cx="38" cy="47" r="6" fill="#2B2A4C"/><circle cx="62" cy="47" r="6" fill="#2B2A4C"/><circle cx="40" cy="45" r="2" fill="#fff"/><circle cx="64" cy="45" r="2" fill="#fff"/><path d="M45 56 L55 56 L50 64Z" fill="#FF8A3D"/></svg>
    <span>Ödev Arkadaşı</span>
  </button>
  <div class="goal"><small id="goalTxt">Bugünkü hedef</small><div class="bar"><i id="goalBar"></i></div></div>
  <div class="pill" id="starPill">⭐ 0</div>
  <button class="iconbtn" data-a="settings" title="Veli Köşesi">⚙️</button>
</header>
<main id="app"></main>
<canvas id="confetti"></canvas>

<script>
/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const strip = s => String(s).replace(/\*\*/g, '');
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let VIEW = 'home';

/* ---------- kayıt ---------- */
const APP_VERSION = '20261107.1724';
const KEY = 'odev-arkadasi-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
let S = Object.assign({ name: '', stars: 0, goal: 10, day: '', dayStars: 0, stats: {}, mistakes: [], sound: true, rate: 1.15, autoRead: true, voice: '' }, load() || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function rollDay() { if (S.day !== today()) { S.day = today(); S.dayStars = 0; save(); } }
function addStar() { rollDay(); S.stars++; S.dayStars++; save(); updateHeader(); if (S.dayStars === S.goal) setTimeout(() => { confetti(); sfx('win'); }, 300); }
function stat(mod, ok) { const s = S.stats[mod] || (S.stats[mod] = { c: 0, w: 0 }); ok ? s.c++ : s.w++; save(); }
function addMistake(it) { if (!S.mistakes.some(m => m.key === it.key)) { S.mistakes.unshift(JSON.parse(JSON.stringify(it))); S.mistakes = S.mistakes.slice(0, 60); save(); } }
function removeMistake(key) { S.mistakes = S.mistakes.filter(m => m.key !== key); save(); }
function updateHeader() {
  rollDay();
  $('#starPill').textContent = '⭐ ' + S.stars;
  const done = Math.min(S.dayStars, S.goal);
  $('#goalTxt').textContent = S.dayStars >= S.goal ? `Bugünkü hedef tamam! 🎉 (${S.dayStars} ⭐)` : `Bugünkü hedef: ${done} / ${S.goal} ⭐`;
  $('#goalBar').style.width = (done / S.goal * 100) + '%';
}

/* ---------- ses, konuşma, konfeti ---------- */
let AC;
function sfx(t) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ok: [660, 880], win: [523, 659, 784, 1046], no: [240, 190], tick: [520] }[t] || [440];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * .12;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.22, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .25);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + .3);
    });
  } catch (e) {}
}
function trVoices() { try { return speechSynthesis.getVoices().filter(v => /^tr/i.test(v.lang)); } catch (e) { return []; } }
function bestVoice() {
  const vs = trVoices(); if (!vs.length) return null;
  if (S.voice) { const v = vs.find(v => v.name === S.voice); if (v) return v; }
  const score = v => (/yelda/i.test(v.name) ? 40 : 0) + (/premium|enhanced|geliştirilmiş|premium/i.test(v.name) ? 20 : 0) + (/google/i.test(v.name) ? 10 : 0) + (v.localService ? 5 : 0);
  return vs.slice().sort((a, b) => score(b) - score(a))[0];
}
function forSpeech(t) {
  return strip(t)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{1F900}-\u{1F9FF}]/gu, '')
    .replace(/×/g, ' çarpı ').replace(/−/g, ' eksi ').replace(/\+/g, ' artı ').replace(/▢/g, ' boşluk ').replace(/= \?/g, ' kaç eder').replace(/=/g, ' eşittir ')
    .replace(/\s*·\s*/g, ', ').replace(/\s{2,}/g, ' ').trim();
}
function speak(t, opts) {
  opts = opts || {};
  try {
    const s = window.speechSynthesis; if (!s) return; s.cancel();
    const txt = forSpeech(t); if (!txt) return;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'tr-TR'; u.rate = opts.rate || S.rate || 1.15; u.pitch = 1.05;
    const v = bestVoice(); if (v) u.voice = v;
    if (opts.onend) u.onend = opts.onend;
    s.speak(u);
  } catch (e) {}
}
function autoSpeak(t) { if (S.autoRead) speak(t); }
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- sesle konuşma (mikrofon) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function listen(onText, onState) {
  if (!SR) { onState('nosupport'); return; }
  if (listening) { try { rec.stop(); } catch (e) {} return; }
  stopSpeak();
  rec = new SR(); rec.lang = 'tr-TR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalT = '';
  rec.onstart = () => { listening = true; onState('on'); };
  rec.onresult = e => { let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) { t += e.results[i][0].transcript; if (e.results[i].isFinal) finalT += e.results[i][0].transcript; } onText(finalT || t, false); };
  rec.onerror = e => { listening = false; onState(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'denied' : e.error === 'no-speech' ? 'nospeech' : 'err'); };
  rec.onend = () => { const was = listening; listening = false; onState('off'); if (was && finalT.trim()) onText(finalT.trim(), true); };
  try { rec.start(); } catch (e) { listening = false; onState('err'); }
}
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#FF8A3D', '#3D9BFF', '#20B072', '#8E6CEF', '#FF5C8A', '#FFC93C'];
  const P = Array.from({ length: 150 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, r: 5 + Math.random() * 6, c: pick(cols), a: Math.random() * 6 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.a += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6); x.restore(); });
    if (++f < 200) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- içerik: MEB 2. sınıf ---------- */
const WORDS = ['ki-tap|📕','o-kul|🏫','öğ-ret-men|👩‍🏫','ar-ka-daş|🧑‍🤝‍🧑','bah-çe|🏡','a-ğaç|🌳','ke-le-bek|🦋','çi-çek|🌸','gü-neş|☀️','pen-ce-re|🪟','bi-sik-let|🚲','te-le-viz-yon|📺','ka-rın-ca|🐜','kur-ba-ğa|🐸','zü-ra-fa|🦒','pa-pat-ya|🌼','fut-bol|⚽','çan-ta|🎒','or-man|🌲','de-niz|🌊','yağ-mur|🌧️','mey-ve|🧺','ar-mut|🍐','ki-raz|🍒','kar-puz|🍉','u-çurt-ma|🪁','sa-at|⏰','ka-lem|✏️','ço-cuk|🧒','def-ter|📒','ö-dev|📝','kır-mı-zı|🔴','tu-run-cu|🟠','söz-lük|📖','gök-ku-şa-ğı|🌈','don-dur-ma|🍦','pen-gu-en|🐧','tav-şan|🐰','kap-lum-ba-ğa|🐢','a-yak-ka-bı|👟','şem-si-ye|☂️','el-ma|🍎','ba-lık|🐟','yıl-dız|⭐','sin-cap|🐿️'];

/* ---------- soru üreticiler ---------- */
function makeOpts(ans) {
  const s = new Set();
  const sw = +String(ans).split('').reverse().join('');
  shuffle([ans + 1, ans - 1, ans + 10, ans - 10, ans + 2, ans - 2, sw]).forEach(v => { if (v >= 0 && v !== ans && s.size < 3) s.add(v); });
  while (s.size < 3) { const v = ans + rand(3, 12); if (v !== ans) s.add(v); }
  return shuffle([ans, ...s]).map(String);
}
function explainAdd(a, b) {
  const ab = a % 10, bb = b % 10, ao = Math.floor(a / 10), bo = Math.floor(b / 10), s1 = ab + bb, e = s1 >= 10;
  let t = `Önce **birlikler**: ${ab} + ${bb} = ${s1}.`;
  if (e) t += ` 10 birlik 1 onluk eder → ${s1 % 10} yaz, **elde 1** ✋.`;
  t += ` Sonra **onluklar**: ${ao} + ${bo}${e ? ' + 1 (elde)' : ''} = ${ao + bo + (e ? 1 : 0)}.\nSonuç: **${a + b}** 🎉`;
  return t;
}
function explainSub(a, b) {
  const ab = a % 10, bb = b % 10, ao = Math.floor(a / 10), bo = Math.floor(b / 10);
  if (ab >= bb) return `Önce **birlikler**: ${ab} − ${bb} = ${ab - bb}. Sonra **onluklar**: ${ao} − ${bo} = ${ao - bo}.\nSonuç: **${a - b}** 🎉`;
  return `Birlikler yetmiyor: ${ab} içinden ${bb} çıkmaz! 🤔 Komşudan **1 onluk ödünç** al → ${ab + 10} − ${bb} = ${ab + 10 - bb}.\nOnluklar bir azaldı: ${ao - 1} − ${bo} = ${ao - 1 - bo}. Sonuç: **${a - b}** 🎉`;
}
function mathItem(mode) {
  if (mode === 'karisik') mode = pick(['topla', 'cikar', 'carp', 'eksik']);
  let a, b, ans, prompt, explain, visual = null;
  if (mode === 'topla') { a = rand(10, 79); b = rand(3, Math.min(39, 99 - a)); ans = a + b; prompt = `${a} + ${b} = ?`; explain = explainAdd(a, b); visual = [a, b]; }
  else if (mode === 'cikar') { a = rand(21, 99); b = rand(3, a - 5); ans = a - b; prompt = `${a} − ${b} = ?`; explain = explainSub(a, b); visual = [a, b]; }
  else if (mode === 'carp') {
    a = rand(2, 5); b = rand(1, 10); ans = a * b; prompt = `${a} × ${b} = ?`;
    const seq = Array.from({ length: a }, (_, i) => b * (i + 1)).join(', ');
    explain = `${a} × ${b}, "**${a} kere ${b}**" demektir: ${Array(a).fill(b).join(' + ')} = **${ans}**.\nRitmik say: ${seq} 🥁`;
  } else {
    const c = rand(25, 99); a = rand(5, c - 4); b = c - a; ans = b; prompt = `${a} + ▢ = ${c}`;
    explain = `Eksik sayıyı bulmak için **büyük sayıdan küçüğü çıkar**: ${c} − ${a} = ${b}.\nKontrol et: ${a} + ${b} = ${c} ✔️`;
  }
  return { kind: 'mcq', mod: 'math', prompt, options: makeOpts(ans), answer: String(ans), explain, visual, key: 'm:' + prompt };
}
function heceItem(w) {
  const [s, emoji] = w.split('|'); const parts = s.split('-'); const word = parts.join('');
  return { kind: 'hece', mod: 'turkce', word, parts, emoji, key: 'h:' + word,
    explain: `**${parts.join(' · ')}** — Kelimeyi söylerken her hecede el çırp: ${parts.map(p => p + ' 👏').join(' ')}\nKural: Her hecede **bir tane sesli harf** (a, e, ı, i, o, ö, u, ü) vardır!` };
}
function yazimItem([ok, no, rule]) {
  return { kind: 'mcq', mod: 'turkce', emoji: '✍️', prompt: ok.length > 12 ? 'Hangi cümle doğru yazılmış?' : 'Hangisi doğru yazılmış?', options: shuffle([ok, no]), answer: ok, explain: rule, key: 'y:' + ok };
}
function bilgiItem([q, ok, wrong, ex, emo]) {
  return { kind: 'mcq', mod: 'bilgi', emoji: emo || '🇬🇧', prompt: q, options: shuffle([ok, ...wrong]), answer: ok, explain: ex, key: 'b:' + q };
}

let R = null;
function play(v) {
  const [m, mode] = v.split(':'); let items, title;
  if (m === 'math') { const seen = new Set(); items = []; while (items.length < 10) { const it = mathItem(mode); if (!seen.has(it.key)) { seen.add(it.key); items.push(it); } } title = MENUS.math.items.find(x => x[0] === v)[2]; }
  else if (v === 'tr:hece') { items = shuffle(WORDS).slice(0, 8).map(heceItem); title = 'Hece Sırala'; }
  else if (v === 'tr:yazim') { items = shuffle(YAZIM).slice(0, 8).map(yazimItem); title = 'Doğru Yazım'; }
  else { const pool = mode === 'hayat' ? HAYAT : mode === 'ing' ? ING : [...HAYAT, ...ING]; items = shuffle(pool).slice(0, 10).map(bilgiItem); title = MENUS.bilgi.items.find(x => x[0] === v)[2]; }
  startRound(title, items, false, v);
}
function startReview() {
  if (!S.mistakes.length) return home();
  const items = shuffle(S.mistakes).slice(0, 10).map(m => { const c = JSON.parse(JSON.stringify(m)); if (c.kind === 'mcq') c.options = shuffle(c.options); return c; });
  startRound('Hata Defterim 📕', items, true, 'review');
}
function startRound(title, items, review, replay) { R = { title, items, review, replay, i: 0, ok: 0, res: [], answered: false }; VIEW = 'round'; renderQ(); }
const cur = () => R.items[R.i];
function roundTop() {
  return `<div class="rtop"><button class="btn soft sm" data-a="home">← Çık</button><div class="rtitle">${esc(R.title)}</div><div class="dots">${R.items.map((_, i) => `<i class="${R.res[i] || (i === R.i ? 'now' : '')}"></i>`).join('')}</div></div>`;
}
function renderQ() {
  const it = cur(); R.answered = false;
  if (it.kind === 'hece') {
    R.pos = 0; R.miss = false;
    let sh = shuffle(it.parts); let g = 0; while (sh.join() === it.parts.join() && g++ < 10) sh = shuffle(it.parts);
    app.innerHTML = roundTop() + `<div class="qcard"><div class="qemo">${it.emoji}</div>
      <div class="qtext">Heceleri sırayla seç! <button class="iconbtn sm" data-a="speak" data-t="${esc(it.word)}" title="Sesli oku">🔊</button></div>
      <div class="slots">${it.parts.map((_, i) => `<span class="slot" id="s${i}"></span>`).join('')}</div>
      <div class="opts sylls">${sh.map(p => `<button class="opt syl" data-a="syl" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
      <div id="fb"></div></div>`;
    autoSpeak('Heceleri sırayla seç. Kelime: ' + it.word);
  } else {
    app.innerHTML = roundTop() + `<div class="qcard">
      ${it.emoji ? `<div class="qemo">${it.emoji}</div>` : ''}
      <div class="qtext ${it.mod === 'math' ? 'big' : ''}">${esc(it.prompt)}<button class="iconbtn sm" data-a="speak" data-t="${esc(it.prompt)}" title="Sesli oku">🔊</button></div>
      <div class="opts n${it.options.length}">${it.options.map((o, i) => `<button class="opt" data-a="opt" data-v="${i}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></div>`;
    autoSpeak(it.mod === 'math' ? it.prompt : it.prompt + '. ' + it.options.map((o, i) => (i + 1) + ': ' + o).join('. '));
  }
}
function blocks(v) {
  return `<div class="blocks">${v.map(n => { const t = Math.floor(n / 10), o = n % 10; return `<div class="bgroup"><div class="blbl">${n} = ${t} onluk ${o} birlik</div><div class="blks">${'<span class="ten"></span>'.repeat(t)}${'<span class="one"></span>'.repeat(o)}</div></div>`; }).join('')}</div>`;
}
function explainBox(it, withNext) {
  return `<div class="explain"><div class="exh">🦉 Bilge diyor ki:</div><div>${md(it.explain)}</div>${it.visual ? blocks(it.visual) : ''}
  <div class="row">${withNext ? '<button class="btn primary" data-a="next" id="nextb">Anladım, devam ➜</button>' : ''}<button class="btn soft" data-a="ask">🦉 Bilge'ye sor</button><button class="btn soft" data-a="speak" data-t="${esc(strip(it.explain))}">🔊 Dinle</button></div></div>`;
}
function answerMCQ(el, i) {
  if (R.answered) return; R.answered = true;
  const it = cur(), val = it.options[+i], ok = val === it.answer;
  document.querySelectorAll('.opt').forEach(b => { const v = it.options[+b.dataset.v]; if (v === it.answer) b.classList.add('ok'); else if (b === el) b.classList.add('no'); b.disabled = true; });
  if (ok) win(); else { R.lastWrong = { it, val }; R.res[R.i] = 'no'; stat(it.mod, false); addMistake(it); sfx('no'); $('#fb').innerHTML = explainBox(it, true); autoSpeak('Olsun, birlikte bakalım. ' + strip(it.explain)); }
}

  $('#sGoal').addEventListener('change', e => { S.goal = +e.target.value; save(); updateHeader(); });
  $('#sSound').addEventListener('change', e => { S.sound = e.target.checked; save(); });
  const sk = $('#sKey'); if (sk) { sk.addEventListener('input', e => { S.apiKey = e.target.value.trim(); save(); resetSample(); }); $('#sModel').addEventListener('change', e => { S.model = e.target.value; save(); }); }
  $('#sAuto').addEventListener('change', e => { S.autoRead = e.target.checked; save(); });
  $('#sRate').addEventListener('change', e => { S.rate = +e.target.value; save(); speak('Merhaba! Ben Bilge Baykuş. Bu hızda konuşuyorum.'); });
  $('#sVoice').addEventListener('change', e => { S.voice = e.target.value; save(); speak('Merhaba! Bu sesi beğendin mi?'); });
}

/* ---------- olaylar ---------- */
const A = {
  home: () => { stopSpeak(); if (R) R.savedHTML = null; home(); }, help: () => { stopSpeak(); help(); }, menu: v => { stopSpeak(); menu(v); }, play: v => play(v),
  opt: (v, el) => answerMCQ(el, v), syl: (v, el) => pickSyl(el), next: () => next(),
  replay: () => R.replay === 'review' ? startReview() : play(R.replay), review: () => startReview(),
  speak: (v, el) => speak(el.dataset.t || ''), settings: () => { stopSpeak(); settings(); },
  testv: () => speak('Merhaba! Ben Bilge Baykuş. Üç artı beş kaç eder? Sekiz! Harikasın!'),
  chip: (v, el) => send(el.dataset.t), newchat: () => { chat = []; chatImg = null; pending = null; help(); },
  rmimg: () => { pending = null; $('#imgprev').innerHTML = ''; },
  mic: () => {
    const b = $('#mic'), ti = $('#ti'), nos = $('#nos');
    listen((text, done) => { ti.value = text; if (done) { ti.value = ''; send(text); } },
      st => {
        b.classList.toggle('on', st === 'on');
        nos.textContent = st === 'on' ? '🎤 Dinliyorum… konuş, bitince kendiliğinden gönderirim.' : st === 'denied' ? 'Mikrofon izni verilmemiş. Tarayıcı ayarlarından mikrofona izin ver, ya da yazarak sor ✍️'
          : st === 'nospeech' ? 'Ses duyamadım, bir daha dener misin? 🎤' : st === 'nosupport' ? 'Bu tarayıcıda sesle konuşma yok; yazarak sorabilirsin ✍️' : st === 'err' ? 'Mikrofon şu an çalışmadı, yazarak sorabilirsin ✍️' : '';
      });
  },
  stopv: () => stopSpeak(),
  reload: () => location.reload(),
  balloon: () => balloonStart(), bgo: () => balloonGo(), car: () => carStart(), cgo: () => carGo(),
  showkey: (v, el) => { const i = $('#sKey'); i.type = i.type === 'password' ? 'text' : 'password'; el.textContent = i.type === 'password' ? 'Göster' : 'Gizle'; },
  testkey: async (v, el) => {
    const r = $('#tkr'); if (!S.apiKey) { r.textContent = 'Önce anahtarı girin.'; return; }
    el.disabled = true; r.textContent = 'Deneniyor…'; resetSample();
    try { const s = await getSample(); const out = await s([{ role: 'user', content: 'Sadece "Merhaba, ben Bilge Baykuş!" yaz.' }], {}); r.textContent = '✅ Bağlandı: ' + out.text.slice(0, 60); }
    catch (e) { r.textContent = '❌ ' + (e.code === 'not_granted' ? 'Anahtar kabul edilmedi' : 'Bağlanamadı') + (e.message ? ' — ' + e.message : '') + ` (anahtar ${S.apiKey.length} karakter, "${S.apiKey.slice(0, 11)}…" ile başlıyor)`; }
    el.disabled = false;
  },
  ask: () => {
    const { it, val } = R.lastWrong || { it: cur() };
    const t = it.kind === 'hece' ? `"${it.word}" kelimesinin hecelerini sıralarken karıştırdım. Bana heceleri nasıl bulacağımı öğretir misin?`
      : `Bu soruda yanıldım: "${it.prompt}". Ben "${val}" dedim ama doğrusu "${it.answer}". Neden böyle olduğunu bana anlatır mısın?`;
    R.savedHTML = app.innerHTML; stopSpeak();
    chat = []; chatImg = null; pending = null; help(t);
  },
  backq: () => { if (!R || !R.savedHTML) return home(); stopSpeak(); VIEW = 'round'; app.innerHTML = R.savedHTML; R.savedHTML = null; },
  setname: () => { const v = ($('#nm') || {}).value; if (v && v.trim()) { S.name = v.trim(); save(); home(); } },
  clrm: () => { S.mistakes = []; save(); settings(); },
  reset: (v, el) => {
    if (!resetArm) { resetArm = true; el.textContent = 'Emin misiniz? Tekrar tıklayın'; return; }
    const keep = { name: S.name, goal: S.goal, sound: S.sound };
    S = Object.assign({ stars: 0, day: '', dayStars: 0, stats: {}, mistakes: [] }, keep); save(); updateHeader(); settings();
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const f = A[el.dataset.a]; if (f) f(el.dataset.v, el, e); });
document.addEventListener('keyup', e => { if (!C) return; if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') C.gas = false; if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') C.brake = false; });
window.addEventListener('resize', () => { if (VIEW === 'balloon') { balloonResize(); balloonDraw(); } if (VIEW === 'car') { carResize(); carDraw(); } });
document.addEventListener('keydown', e => {
  if (VIEW === 'car' && C) { if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); if (!C.gas) { C.gas = true; sfx('tick'); } return; } if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); C.brake = true; return; } if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); carSteer(-1); } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); carSteer(1); } else if (e.key === 'Enter' && !C.running && C.light < 0) carGo(); return; }
  if (VIEW === 'balloon' && G) { const n = +e.key; if (G.running && n >= 1 && n <= 5) { const b = G.balloons.find(b => b.key === n); if (b) balloonHit(b); } else if (e.key === 'Enter' && !G.running) balloonGo(); return; }
  if (VIEW !== 'round' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'Enter' && $('#nextb')) { e.preventDefault(); next(); return; }
  const n = +e.key; if (n >= 1 && n <= 4 && cur().kind === 'mcq' && !R.answered) { const b = document.querySelector(`.opt[data-v="${n - 1}"]`); if (b) answerMCQ(b, n - 1); }
});
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (VIEW === 'settings') settings(); }; } catch (e) {}
updateHeader(); home();
/* sürüm kontrolü: sunucuda yeni sürüm varsa şerit göster */
(async function checkUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }); const t = await r.text();
    const m = t.match(/APP_VERSION = '([^']+)'/); if (m && m[1] !== APP_VERSION) {
      const d = document.createElement('div'); d.className = 'upd'; d.innerHTML = '✨ Yeni sürüm hazır! <button class="btn primary sm" id="updb">Yenile</button>'; document.body.appendChild(d);
      $('#updb').onclick = () => location.reload();
    }
  } catch (e) {}
})();
</script>
